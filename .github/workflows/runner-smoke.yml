name: runner-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: runner allocation probe
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Runner identity
        shell: bash
        run: |
          set -euxo pipefail
          echo "runner=${RUNNER_NAME}"
          echo "os=${RUNNER_OS}"
          echo "arch=${RUNNER_ARCH}"
          echo "workspace=${GITHUB_WORKSPACE}"
          uname -a
          python3 --version
      - name: Minimal execution probe
        shell: bash
        run: |
          set -euxo pipefail
          test -n "${RUNNER_NAME}"
          test "${RUNNER_OS}" = "Linux"
          python3 - <<'PY'
          import os
          print("runner probe ok")
          print("pid=", os.getpid())
          print("cwd=", os.getcwd())
          PY
      - name: Upload runner probe
        if: always()
        shell: bash
        run: |
          {
            echo "runner=${RUNNER_NAME:-unknown}"
            echo "os=${RUNNER_OS:-unknown}"
            echo "arch=${RUNNER_ARCH:-unknown}"
            date -u
          } > runner-smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-smoke
          path: runner-smoke.txt
