name: tests

on:
  push:
    branches: [main, 'feat/**', 'batch/**']
  pull_request:

env:
  PYTEST_ADDOPTS: "-ra --strict-markers"

jobs:
  baseline:
    name: baseline / ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [unit, integration, runtime, e2e]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest pytest-asyncio pytest-timeout fastapi pydantic httpx
      - name: Run ${{ matrix.group }} baseline tests with hang diagnostics
        shell: bash
        run: |
          mkdir -p test-results
          python -m pytest tests -q -m "${{ matrix.group }}" \
            --timeout=60 --timeout-method=thread \
            --durations=25 --junitxml="test-results/${{ matrix.group }}.xml" \
            2>&1 | tee "test-results/${{ matrix.group }}.log"
      - name: Upload ${{ matrix.group }} diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.group }}-diagnostics
          path: test-results/
          if-no-files-found: warn

  chaos:
    name: chaos / destructive fault injection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest pytest-asyncio pytest-timeout fastapi pydantic httpx
      - name: Run chaos tests with hard timeout
        run: python -m pytest tests -q -m chaos --timeout=90 --timeout-method=thread --durations=25
