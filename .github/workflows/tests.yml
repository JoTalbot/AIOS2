name: tests

on:
  push:
    branches: [main, 'feat/**', 'batch/**']
  pull_request:

jobs:
  pytest:
    runs-on: runnerhut-linux-2vcpu-d03d2827
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest pytest-asyncio fastapi pydantic httpx
      - name: Run test suite
        run: python -m pytest tests -q
