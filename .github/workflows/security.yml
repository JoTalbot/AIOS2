name: security

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  security-regression:
    runs-on: ubuntu-latest
    env:
      AIOS_OPERATOR_TOKEN: ci-test-token-16
      AIOS_OPERATOR_ROLE: operator
      AIOS_OPERATOR_ACTOR: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest fastapi pydantic httpx
      - name: Run security regression suite
        run: python -m pytest tests/test_recovery_rbac_matrix.py -q
