name: RunnerHut Test

on:
  workflow_dispatch:

jobs:
  runner-test:
    runs-on: runnerhut-linux-2vcpu-d03d2827
    timeout-minutes: 10
    steps:
      - name: Runner diagnostics
        run: |
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          uname -a
          python --version || true
