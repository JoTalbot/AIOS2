[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aios"
version = "0.1.0"
description = "AI Operating System for Autonomous Agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
# These four files exercise the removed legacy scheduler/API surface. Keep
# them visible in the repository for migration, but exclude them from the
# canonical new-architecture gate until their tests are rewritten.
addopts = "-ra --ignore=tests/test_agent_executor.py --ignore=tests/test_api_main.py --ignore=tests/test_fresh_runtime_execution_recovery.py --ignore=tests/test_pr252_scheduler_tool_integration.py"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true

[tool.setuptools]
packages = ["runtime", "api"]
